<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<style>
  :root {
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.18);
    --glass-highlight: rgba(255,255,255,0.35);
    --text-primary: #f5f6f7;
    --text-secondary: rgba(235,238,242,0.6);
    --accent: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* ambient glow behind the card, derived from the artwork */
  #ambient {
    position: fixed;
    inset: -20%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.05), transparent 60%);
    filter: blur(80px);
    transition: background 0.8s ease;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- Gradient background themes ---------- */
  /* Each theme is its own full-screen layer, stacked and crossfaded via
     opacity — this lets switching between totally different gradients
     animate smoothly, which a plain `background` transition can't do. */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .bg-layer.active { opacity: 1; }

  .bg-layer[data-theme="none"] {
    background: #000;
  }
  .bg-layer[data-theme="purple"] {
    background:
      radial-gradient(circle at 15% 15%, rgba(139,92,246,0.55), transparent 55%),
      radial-gradient(circle at 88% 12%, rgba(236,72,153,0.30), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(124,58,237,0.45), transparent 60%),
      #0a0416;
  }
  .bg-layer[data-theme="teal"] {
    background:
      radial-gradient(circle at 18% 18%, rgba(45,212,191,0.50), transparent 55%),
      radial-gradient(circle at 85% 20%, rgba(6,182,212,0.35), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(13,148,136,0.45), transparent 60%),
      #030f0d;
  }
  .bg-layer[data-theme="orange"] {
    background:
      radial-gradient(circle at 18% 18%, rgba(251,146,60,0.55), transparent 55%),
      radial-gradient(circle at 88% 15%, rgba(245,158,11,0.35), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(234,88,12,0.45), transparent 60%),
      #140a02;
  }
  .bg-layer[data-theme="babyblue"] {
    background:
      radial-gradient(circle at 18% 18%, rgba(125,211,252,0.55), transparent 55%),
      radial-gradient(circle at 85% 15%, rgba(56,189,248,0.32), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(14,165,233,0.40), transparent 60%),
      #03101a;
  }

  /* Theme switcher — small swatch row, fixed to the top */
  .theme-switcher {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .theme-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .theme-dot:hover { transform: scale(1.12); }
  .theme-dot.active {
    border-color: rgba(255,255,255,0.85);
    transform: scale(1.12);
  }

  /* Native <input type="color"> styled to match the preset swatch dots */
  .custom-color-input {
    background: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .custom-color-input::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .custom-color-input::-webkit-color-swatch { border: none; border-radius: 50%; }
  .custom-color-input::-moz-color-swatch { border: none; border-radius: 50%; }

  /* Settings gear — opens the upload/uploads panel */
  .settings-btn {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 10;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .settings-btn:hover { background: rgba(255,255,255,0.14); }
  .settings-btn:active { transform: scale(0.92); }
  .settings-btn svg { width: 18px; height: 18px; }

  /* ---------- Floating bubbles ---------- */
  #bubbles {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.38), rgba(255,255,255,0.05) 55%, transparent 75%);
    border: 1px solid rgba(255,255,255,0.10);
    animation: bubble-float var(--dur, 20s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }
  @keyframes bubble-float {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(var(--dx1, 15px), var(--dy1, -30px)) scale(1.04); }
    50%  { transform: translate(var(--dx2, -12px), var(--dy2, -55px)) scale(0.97); }
    75%  { transform: translate(var(--dx3, 10px), var(--dy3, -25px)) scale(1.02); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
  }

  .tilt-wrap {
    position: relative;
    z-index: 1;
    width: min(340px, 88vw);
    border-radius: 44px;
    will-change: transform;
  }

  .player {
    position: relative;
    width: 100%;
    padding: 22px 22px 24px;
    border-radius: 44px;
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    color: var(--text-primary);
    user-select: none;
    overflow: hidden;
    --mx: 50%;
    --my: 30%;
  }

  /* specular highlight that tracks the cursor — gives the glass a "gyroscope" sheen */
  .player .sheen {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,0.22), transparent 55%);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 5;
  }
  .tilt-wrap.tilting .sheen { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .tilt-wrap { transform: none !important; }
    .player .sheen { display: none; }
  }

  /* top glossy sheen */
  .player::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    border-radius: 44px 44px 100% 100% / 44px 44px 60px 60px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }

  /* ARTWORK — auto-synced with the current track, no upload */
  .artwork-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 26px;
    overflow: hidden;
    background: linear-gradient(135deg, #1c1c1e, #050505);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .artwork-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .artwork-wrap img.loaded { opacity: 1; }

  .artwork-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.2);
  }
  .artwork-fallback svg { width: 40px; height: 40px; }
  .artwork-wrap img.loaded + .artwork-fallback { display: none; }

  /* METADATA */
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 18px;
  }

  .meta-text { min-width: 0; flex: 1; }

  .track-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    background: transparent;
    border: none;
    color: var(--text-primary);
    width: 100%;
    padding: 0;
    outline: none;
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-title::placeholder { color: rgba(255,255,255,0.28); text-transform: none; letter-spacing: 0; font-weight: 600; }

  .track-artist {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 400;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    width: 100%;
    padding: 0;
    outline: none;
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist::placeholder { color: rgba(255,255,255,0.22); }

  .meta-controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 10px;
    margin-top: 4px;
  }

  .icon-btn {
    position: relative;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    transition: color 0.15s ease, transform 0.12s ease;
  }
  .icon-btn:active { transform: scale(0.88); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .icon-btn.active { color: #fff; }

  .like-btn.active { color: #ff375f; }
  .like-btn.active svg { fill: #ff375f; }

  .repeat-one-badge {
    position: absolute;
    bottom: -3px;
    right: -4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 8px;
    font-weight: 800;
    font-family: inherit;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .repeat-one-badge.show { display: flex; }

  /* ---------- Queue overlay ---------- */
  .queue-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    background: rgba(8,8,12,0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    padding: 20px 20px 16px;
  }
  .queue-overlay.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .queue-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    margin-bottom: 14px;
  }
  .queue-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--text-primary);
  }
  .queue-header-actions { display: flex; align-items: center; gap: 16px; }
  .queue-header-actions .icon-btn svg { width: 17px; height: 17px; }

  .queue-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 0 -8px;
    padding: 0 8px;
  }

  .queue-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 14px;
    cursor: pointer;
    background: transparent;
    transition: background 0.15s ease;
  }
  .queue-item:hover { background: rgba(255,255,255,0.06); }
  .queue-item.active { background: rgba(255,255,255,0.10); }
  .queue-item.dragging {
    background: rgba(255,255,255,0.13);
    box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    z-index: 5;
  }

  .queue-item-handle {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 26px;
    color: rgba(255,255,255,0.28);
    cursor: grab;
    touch-action: none; /* keep touch drags from also scrolling the list */
  }
  .queue-item-handle:active { cursor: grabbing; }
  .queue-item-handle svg { width: 15px; height: 15px; display: block; }
  .queue-list.filtered .queue-item-handle { visibility: hidden; }

  .queue-item-art {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.06);
  }

  .queue-item-text { min-width: 0; flex: 1; }
  .queue-item-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .queue-item.active .queue-item-title { color: #fff; }
  .queue-item-artist {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-item-like {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 4px;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
  }
  .queue-item-like svg { width: 16px; height: 16px; display: block; }
  .queue-item-like.liked { color: #ff375f; }
  .queue-item-like.liked svg { fill: #ff375f; }

  .queue-empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 30px;
  }

  /* ---------- Settings overlay ---------- */
  .settings-overlay {
    position: absolute;
    inset: 0;
    z-index: 21;
    display: flex;
    flex-direction: column;
    background: rgba(8,8,12,0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    padding: 20px 20px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .settings-overlay.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .settings-section { margin-bottom: 22px; }
  .settings-section-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .settings-hint {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: -4px;
    margin-bottom: 12px;
  }

  .upload-field { display: block; margin-bottom: 12px; }
  .upload-field span {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 5px;
  }
  .upload-field input[type="file"],
  .upload-field input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .upload-field input[type="file"] { padding: 7px 10px; font-size: 12px; }
  .upload-field input[type="text"]::placeholder { color: rgba(255,255,255,0.3); }

  .upload-submit-btn {
    width: 100%;
    padding: 11px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.92);
    color: #000;
    font-weight: 700;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.1s ease;
  }
  .upload-submit-btn:active { transform: scale(0.98); }

  .upload-status {
    margin-top: 9px;
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 14px;
  }
  .upload-status.error { color: #ff6b6b; }
  .upload-status.success { color: #4ade80; }

  .uploads-list { display: flex; flex-direction: column; gap: 6px; }
  .upload-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
  }
  .upload-item-art {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .upload-item-text { min-width: 0; flex: 1; }
  .upload-item-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .upload-item-artist {
    font-size: 11.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .upload-item-delete {
    flex-shrink: 0;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    padding: 6px;
  }
  .upload-item-delete:hover { color: #ff6b6b; }
  .upload-item-delete svg { width: 16px; height: 16px; display: block; }

  .uploads-empty {
    font-size: 12.5px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 8px;
  }

  /* SCRUBBER */
  .scrubber { margin-top: 16px; }

  .scrub-track {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.18);
    cursor: pointer;
  }
  .scrub-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 30%;
    border-radius: 3px;
    background: #f2f2f2;
  }
  .scrub-knob {
    position: absolute;
    top: 50%;
    left: 30%;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .scrub-track:hover .scrub-knob { opacity: 1; }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* TRANSPORT CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    padding: 0 6px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border-radius: 50%;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .ctrl-btn:active { transform: scale(0.88); opacity: 0.7; }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .ctrl-btn.play svg { width: 34px; height: 34px; }

  /* VOLUME */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }

  .vol-icon { flex-shrink: 0; color: rgba(255,255,255,0.55); width: 15px; height: 15px; }
  .vol-icon.loud { width: 18px; height: 18px; }

  .vol-track {
    position: relative;
    flex: 1;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.18);
    cursor: pointer;
  }
  .vol-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 70%;
    border-radius: 3px;
    background: rgba(235,235,240,0.85);
  }
  .vol-knob {
    position: absolute;
    top: 50%;
    left: 70%;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .vol-track:hover .vol-knob { opacity: 1; }

  /* STATUS / DEVICE PILLS */
  .status-pill,
  .device-pill {
    margin: 18px auto 0;
    width: fit-content;
    max-width: 280px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .status-pill span,
  .device-pill span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .device-pill {
    cursor: pointer;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    transition: background 0.15s ease;
  }
  .device-pill:hover { background: rgba(255,255,255,0.13); }
  .device-pill svg { width: 14px; height: 14px; opacity: 0.8; flex-shrink: 0; }

  /* Live equalizer bars — reacts to actual playback via AnalyserNode */
  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 14px;
    height: 12px;
    flex-shrink: 0;
  }
  .eq-bars span {
    display: block;
    width: 2.5px;
    height: 15%;
    background: currentColor;
    border-radius: 1px;
    transition: height 0.09s linear;
  }

  /* Controls disabled until a track is loaded */
  .controls.no-track .ctrl-btn,
  .scrubber.no-track .scrub-track,
  .volume-row.no-track .vol-track {
    opacity: 0.4;
    pointer-events: none;
  }

  /* Tap-to-enable prompt for the spatial tilt on iOS (motion access needs a real tap) */
  .tilt-permission-btn {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .tilt-permission-btn.show { display: flex; }
  .tilt-permission-btn svg { width: 15px; height: 15px; opacity: 0.9; }

  ::selection { background: rgba(255,255,255,0.25); }

  /* ---------- Touch-friendly tap targets ---------- */
  /* Expands the clickable area on touch devices without changing how
     anything looks — padding grows the hit box, the matching negative
     margin cancels its effect on layout/spacing. */
  @media (pointer: coarse) {
    .icon-btn {
      padding: 9px;
      margin: -9px;
    }
    .queue-item-like {
      padding: 9px;
      margin: -5px -9px -5px 2px;
    }
    .queue-item {
      padding: 10px 8px;
    }
    .device-pill {
      padding: 12px 18px;
    }
    .device-pill svg {
      width: 16px;
      height: 16px;
    }
    .settings-btn {
      width: 46px;
      height: 46px;
    }
    .upload-item-delete {
      padding: 10px;
      margin: -4px -6px -4px 0;
    }
    .queue-item-handle {
      width: 26px;
      height: 34px;
    }
  }
</style>
</head>
<body>

<div class="bg-layer active" data-theme="none"></div>
<div class="bg-layer" data-theme="purple"></div>
<div class="bg-layer" data-theme="teal"></div>
<div class="bg-layer" data-theme="orange"></div>
<div class="bg-layer" data-theme="babyblue"></div>
<div class="bg-layer" data-theme="custom"></div>

<div class="theme-switcher" id="themeSwitcher"></div>

<button class="settings-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
  </svg>
</button>

<div id="bubbles"></div>

<div id="ambient"></div>

<div class="tilt-wrap" id="player">
<div class="player">

  <div class="sheen"></div>

  <!-- Artwork — set automatically from the playlist, no upload -->
  <div class="artwork-wrap" id="artworkWrap">
    <img id="artworkImg" alt="Album artwork">
    <div class="artwork-fallback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="M21 15l-5-5-9 9"/>
      </svg>
    </div>
  </div>

  <!-- Metadata -->
  <div class="meta">
    <div class="meta-text">
      <input class="track-title" id="trackTitle" type="text" placeholder="Song Title" maxlength="40" readonly>
      <input class="track-artist" id="trackArtist" type="text" placeholder="Artist Name" maxlength="40" readonly>
    </div>
    <div class="meta-controls">
      <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h3.3c1.4 0 2.7.7 3.5 1.9L15 18h3.5"/>
          <path d="M15 6h3.5"/>
          <path d="M3 18h3.3c1.4 0 2.7-.7 3.5-1.9"/>
          <polyline points="16.5 3.5 19 6 16.5 8.5"/>
          <polyline points="16.5 15.5 19 18 16.5 20.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="repeatBtn" type="button" aria-label="Repeat" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 22l-4-4 4-4"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span class="repeat-one-badge" id="repeatOneBadge">1</span>
      </button>
      <button class="icon-btn like-btn" id="likeBtn" type="button" aria-label="Like" title="Like">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20.5s-7.5-4.6-10-9.3C.4 7.8 2 4.5 5.3 4c2-.3 3.9.6 5 2.2C11.4 4.6 13.3 3.7 15.3 4c3.3.5 4.9 3.8 3.3 7.2-2.5 4.7-10 9.3-10 9.3z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Queue overlay — opened via the queue pill, populated by queue-and-likes.js -->
  <div class="queue-overlay" id="queueOverlay">
    <div class="queue-header">
      <span class="queue-title">Queue</span>
      <div class="queue-header-actions">
        <button class="icon-btn like-btn" id="queueLikedFilterBtn" type="button" aria-label="Show liked only" title="Show liked only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.5s-7.5-4.6-10-9.3C.4 7.8 2 4.5 5.3 4c2-.3 3.9.6 5 2.2C11.4 4.6 13.3 3.7 15.3 4c3.3.5 4.9 3.8 3.3 7.2-2.5 4.7-10 9.3-10 9.3z"/>
          </svg>
        </button>
        <button class="icon-btn" id="queueCloseBtn" type="button" aria-label="Close queue" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>
    <div class="queue-list" id="queueList"></div>
  </div>

  <!-- Settings overlay — opened via the gear icon, populated by custom-uploads.js -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="queue-header">
      <span class="queue-title">Settings</span>
      <button class="icon-btn" id="settingsCloseBtn" type="button" aria-label="Close settings" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Upload a song</div>
      <form id="uploadForm">
        <label class="upload-field">
          <span>Song file (MP3)</span>
          <input type="file" accept="audio/*,.mp3" id="uploadAudioInput" required>
        </label>
        <label class="upload-field">
          <span>Artwork (optional)</span>
          <input type="file" accept="image/*" id="uploadArtInput">
        </label>
        <label class="upload-field">
          <span>Title</span>
          <input type="text" id="uploadTitleInput" placeholder="Song title" maxlength="60">
        </label>
        <label class="upload-field">
          <span>Artist</span>
          <input type="text" id="uploadArtistInput" placeholder="Artist name" maxlength="60">
        </label>
        <button type="submit" class="upload-submit-btn">Add to Playlist</button>
        <div class="upload-status" id="uploadStatus"></div>
      </form>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">My Uploads</div>
      <div class="uploads-list" id="uploadsList"></div>
    </div>
  </div>

  <!-- Scrubber -->
  <div class="scrubber no-track" id="scrubber">
    <div class="scrub-track" id="scrubTrack">
      <div class="scrub-fill" id="scrubFill"></div>
      <div class="scrub-knob" id="scrubKnob"></div>
    </div>
    <div class="time-row">
      <span id="timeElapsed">0:00</span>
      <span id="timeRemaining">−0:00</span>
    </div>
  </div>

  <!-- Transport -->
  <div class="controls no-track" id="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
    </button>
    <button class="ctrl-btn play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
    </button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
    <div class="vol-track" id="volTrack">
      <div class="vol-fill" id="volFill"></div>
      <div class="vol-knob" id="volKnob"></div>
    </div>
    <svg class="vol-icon loud" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
  </div>

  <!-- Status (shows loading / errors — no interaction needed) -->
  <div class="status-pill">
    <div class="eq-bars" id="eqBars" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <span id="songFileName">Loading…</span>
  </div>

  <!-- Queue toggle (previously an inert "Device Name" pill) -->
  <button class="device-pill" id="queueToggleBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h10M4 18h10"/>
    </svg>
    <span id="queueToggleLabel">Queue</span>
  </button>

  <!-- Real audio element — driven entirely by audio-player.js -->
  <audio id="audioEl" preload="metadata"></audio>

</div>
</div>

<!-- Shown only on devices (iOS) that require an explicit tap to grant motion/gyroscope access -->
<button class="tilt-permission-btn" id="tiltPermissionBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="5" y="2" width="14" height="20" rx="3"/>
    <path d="M9 18h6"/>
  </svg>
  Enable tilt effect
</button>

<!-- All playback + artwork syncing lives in this file -->
<script src="audio-player.js"></script>

<!-- Lock-screen / hardware media controls integration lives in this file -->
<script src="media-session.js"></script>

<!-- Live equalizer bars, driven by a real AnalyserNode, live in this file -->
<script src="audio-visualizer.js"></script>

<!-- Queue panel + liked songs live in this file -->
<script src="queue-and-likes.js"></script>

<!-- User-uploaded songs (settings panel + IndexedDB storage) live in this file -->
<script src="custom-uploads.js"></script>

<!-- Mouse-tilt / gyroscope spatial effect lives in this file -->
<script src="tilt-effect.js"></script>

<!-- Gradient background theme switcher lives in this file -->
<script src="background-themes.js"></script>

<!-- Floating translucent bubbles live in this file -->
<script src="floating-bubbles.js"></script>

</body>
</html>
